name: Compilar portátiles EvalúaFP Canarias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/portables-linux-macos.yml']
    tags: ['v*']

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            artifact: evaluafp-canarias-linux-x64
          - name: macOS Intel
            os: macos-15-intel
            artifact: evaluafp-canarias-macos-intel
          - name: macOS Apple Silicon
            os: macos-15
            artifact: evaluafp-canarias-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Bibliotecas gráficas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2
      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      # La compilación incluye la trazabilidad histórica de la edición beta.4.
      # El generador incorpora canarias_reference y canarias_modules de forma explícita.
      - name: Compilar y probar ejecutable sin interfaz gráfica
        run: python scripts/build_portable_unix.py --test
      - name: Publicar archivo portable (sin datos personales)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/EvaluaFPCanarias_Portatil_*.tar.gz
            dist/EvaluaFPCanarias_Portatil_*.zip
          if-no-files-found: error
          retention-days: 30
