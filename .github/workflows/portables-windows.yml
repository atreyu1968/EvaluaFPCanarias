name: Compilar portátil Windows EvalúaFP Canarias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/portables-windows.yml']

# Reconstrucción de beta.4 con las pruebas de procedencia, horas y
# protección territorial incluidas. Las compilaciones anteriores quedan obsoletas.
# Reconstrucción corregida: compatibilidad con SQLite anterior a la migración.
permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Verificar aplicación antes de empaquetar
        run: python -m unittest discover -s tests -q
      - name: Generar EXE nativo
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "EvaluaFPCanarias" --icon "assets/EvaluaFP.ico" --add-data "web;web" --collect-all fitz --collect-all PIL --collect-all docx --collect-all keyring --collect-all webview --collect-all reportlab --collect-all cryptography --collect-all xlsxwriter --hidden-import xlwt --hidden-import webview.platforms.winforms --hidden-import desktop_caption --hidden-import general_calendar_library --hidden-import canarias_modules --hidden-import canarias_reference --hidden-import calendar_versions --hidden-import calendar_document --hidden-import calendar_annex --hidden-import calendar_ai app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller no ha terminado correctamente" }
          if (-not (Test-Path 'dist/EvaluaFPCanarias.exe')) { throw "No se ha generado el EXE" }
      - name: Preparar paquete sin datos personales
        shell: pwsh
        run: |
          $base='dist/portable_canarias_windows'
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          Copy-Item -LiteralPath 'dist/EvaluaFPCanarias.exe' -Destination "$base/EvaluaFPCanarias.exe"
          '{"mode":"portable","data_dir":"EvaluaFPCanarias_Datos","backup_dir":"EvaluaFPCanarias_Copias"}' | Set-Content -Path "$base/EvaluaFPCanarias.portable.json" -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$base/EvaluaFPCanarias_Datos","$base/EvaluaFPCanarias_Copias" | Out-Null
          Copy-Item -LiteralPath 'README.md' -Destination "$base/LEEME_CANARIAS.md"
          $env:EVALUAFP_CANARIAS_PORTABLE_HOME=(Resolve-Path $base).Path
          $env:EVALUAFP_CANARIAS_PORTABLE='1'
          # --windowed es un ejecutable GUI: PowerShell no espera necesariamente
          # al terminar con el operador &, por lo que $LASTEXITCODE puede quedar obsoleto.
          $exe=(Resolve-Path "$base/EvaluaFPCanarias.exe").Path
          $test=Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "El EXE portátil no supera la prueba de arranque: $($test.ExitCode)" }
          $sqlite="$base/EvaluaFPCanarias_Datos/datos/evaluafp.sqlite3"
          if (-not (Test-Path $sqlite)) { throw "El modo portátil no ha creado su base SQLite aislada" }
          # El artefacto distribuible se entrega limpio, sin SQLite ni logs de la CI.
          Remove-Item -LiteralPath "$base/EvaluaFPCanarias_Datos" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$base/EvaluaFPCanarias_Datos" | Out-Null
          Compress-Archive -Path "$base/*" -DestinationPath 'dist/EvaluaFPCanarias_Portatil_windows_x64.zip' -Force
          if (-not (Test-Path 'dist/EvaluaFPCanarias_Portatil_windows_x64.zip')) { throw "Falta el paquete ZIP" }
      - name: Publicar portable Windows (sin datos personales)
        uses: actions/upload-artifact@v4
        with:
          name: evaluafp-canarias-windows-x64
          path: dist/EvaluaFPCanarias_Portatil_windows_x64.zip
          if-no-files-found: error
          retention-days: 30
